<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2025 戒茂斯上嘉明湖四日縱走</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link rel="stylesheet" href="jiaminglake.css"/>
</head>
<body>
<header class="site-header">
  <div class="header-title">
    <h1>🏔 戒茂斯上嘉明湖四日縱走</h1>
    <p>2025年4月 · 台東 · 四天三夜探索天使的眼淚</p>
  </div>
  <div class="header-stats">
    <div class="stat"><span class="stat-val">~28.4k</span><span class="stat-lbl">總里程</span></div>
    <div class="stat"><span class="stat-val">3,602m</span><span class="stat-lbl">最高點</span></div>
    <div class="stat"><span class="stat-val">21</span><span class="stat-lbl">行程亮點</span></div>
    <div class="stat"><span class="stat-val">4天</span><span class="stat-lbl">行程天數</span></div>
  </div>
</header>

<div class="app">
  <div id="map"></div>
  <aside class="side" id="side-panel">
    <div class="tabs">
      <button class="tab-btn active" data-tab="waypoints">📍 行程亮點</button>
      <button class="tab-btn" data-tab="elevation">📈 高度剖面</button>
    </div>
    <div class="tab-pane active" id="tab-waypoints"><div class="wp-list" id="wp-list"></div></div>
    <div class="tab-pane" id="tab-elevation" style="flex-direction:column">
      <div class="chart-wrap">
        <h4>
          ⛰ 高度剖面
          <span class="chart-hint" id="chart-hint">點擊地標可標記於此</span>
        </h4>
        <div class="chart-container">
          <canvas id="elev-chart"></canvas>
          <svg id="chart-overlay"></svg>
        </div>
      </div>
      <div id="elev-wp-detail" style="display:none;padding:12px 14px 14px;border-top:1px solid #eee;flex:1;overflow-y:auto;">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;">
          <div id="elev-wp-dot" style="width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:#fff;margin-top:2px;"></div>
          <div style="flex:1;min-width:0;">
            <div id="elev-wp-name" style="font-size:.95rem;font-weight:700;color:var(--forest);line-height:1.3;"></div>
            <div id="elev-wp-meta" style="font-size:.72rem;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;"></div>
          </div>
        </div>
        <div id="elev-wp-desc" style="font-size:.78rem;color:#444;line-height:1.7;"></div>
      </div>
      <div id="elev-wp-empty" style="padding:24px 14px;text-align:center;color:var(--muted);font-size:.78rem;flex:1;display:flex;align-items:center;justify-content:center;">
        👆 點擊任一地標，在此查看詳細資訊
      </div>
    </div>
  </aside>
</div>
<button class="drawer-toggle" id="drawer-toggle">📋</button>

<!-- Photo Modal -->
<div id="photo-modal" role="dialog" aria-modal="true">
  <div id="photo-modal-box">
    <!-- 頂部 Header -->
    <div id="photo-modal-header">
      <div id="photo-modal-title-wrap">
        <h2 id="photo-modal-title"></h2>
        <div id="photo-modal-meta"></div>
      </div>
      <div id="photo-modal-nav">
        <button id="wp-nav-prev" class="wp-nav-btn" aria-label="上一點">‹<span class="wp-nav-label"> 上一點</span></button>
        <button id="wp-nav-next" class="wp-nav-btn" aria-label="下一點"><span class="wp-nav-label">下一點 </span>›</button>
        <button id="btn-open-edit-modal" class="wp-nav-btn" aria-label="編輯地標">✏️<span class="wp-nav-label"> 編輯</span></button>
      </div>
      <button id="photo-modal-close" aria-label="關閉">✕</button>
    </div>
    
    <!-- 滾動內容區域 -->
    <div id="photo-modal-scrollable">
      <!-- 地標描述 (獨立段落) -->
      <div id="photo-modal-desc" class="waypoint-description"></div>

      <!-- 照片展示區 -->
      <div id="photo-modal-img-wrap">
        <button class="photo-nav prev" id="photo-prev" aria-label="上一張">&#8249;</button>
        <img id="photo-modal-img" src="" alt="">
        <button class="photo-nav next" id="photo-next" aria-label="下一張">&#8250;</button>
        <!-- 新增此標記點的照片 (照片上浮動按鈕) -->
        <button id="btn-open-upload-modal" class="photo-add-floating-btn" title="新增此標記點的照片">➕</button>
        <!-- 編輯這張照片 (照片上浮動按鈕) -->
        <button id="photo-modal-edit-btn" class="photo-edit-floating-btn" title="編輯這張照片">✏️</button>
        <!-- 刪除此張照片 (照片上浮動按鈕) -->
        <button id="photo-modal-delete-btn" class="photo-delete-floating-btn" title="刪除此張照片">🗑</button>
      </div>

      <!-- 點點 (盡量貼近照片) -->
      <div id="photo-modal-dots"></div>

      <!-- 照片標題與照片段落文案 (貼近照片) -->
      <div class="photo-content-wrap">
        <div id="photo-modal-photo-title"></div>
        <div id="photo-modal-photo-body"></div>
      </div>
    </div>
  </div>
</div>

<!-- Upload Photo Modal (上傳照片 Popup) -->
<div id="upload-modal" role="dialog" aria-modal="true">
  <div id="upload-modal-box">
    <button id="upload-modal-close" aria-label="關閉">✕</button>
    <h3>➕ 新增地標照片</h3>
    <div class="form-group">
      <label for="upload-image">選擇照片</label>
      <input type="file" id="upload-image" accept="image/*" />
    </div>
    <div class="form-group">
      <label for="upload-title">照片標題</label>
      <input type="text" id="upload-title" placeholder="例如: 登頂紀念、登山口合照" />
    </div>
    <div class="form-group">
      <label for="upload-body">說明文案</label>
      <textarea id="upload-body" placeholder="請輸入對該照片的說明或文字紀錄..."></textarea>
    </div>
    <button id="upload-submit" class="btn-submit">上傳並存檔</button>
    <div id="upload-status" class="upload-status"></div>
  </div>
</div>

<!-- Edit Waypoint Modal (編輯地標 Popup) -->
<div id="edit-modal" role="dialog" aria-modal="true">
  <div id="edit-modal-box">
    <button id="edit-modal-close" aria-label="關閉">✕</button>
    <h3>✏️ 編輯地標</h3>
    <div class="form-group">
      <label for="edit-name">地標名稱</label>
      <input type="text" id="edit-name" />
    </div>
    <div class="form-group">
      <label for="edit-day">所屬天數</label>
      <select id="edit-day">
        <option value="D0">D0 交通日</option>
        <option value="D1">D1 戒茂斯段</option>
        <option value="D2">D2 向上深入</option>
        <option value="D3">D3 嘉明湖日</option>
        <option value="D4">D4 向陽下撤</option>
      </select>
    </div>
    <div class="form-group">
      <label for="edit-time">時間</label>
      <input type="text" id="edit-time" placeholder="例如: 8:00" />
    </div>
    <div class="form-group">
      <label for="edit-km">里程 (km)</label>
      <input type="text" id="edit-km" placeholder="例如: 10.2k" />
    </div>
    <div class="form-group">
      <label for="edit-elevation">海拔</label>
      <input type="text" id="edit-elevation" placeholder="例如: 2771m" />
    </div>
    <div class="form-group">
      <label for="edit-desc">故事內容</label>
      <textarea id="edit-desc" class="tall"></textarea>
    </div>
    <button id="edit-submit" class="btn-submit">儲存修改</button>
    <div id="edit-status" class="upload-status"></div>
  </div>
</div>

<!-- Edit Photo Modal (編輯照片 Popup) -->
<div id="edit-photo-modal" role="dialog" aria-modal="true">
  <div id="edit-photo-modal-box">
    <button id="edit-photo-modal-close" aria-label="關閉">✕</button>
    <h3>✏️ 編輯照片</h3>
    <div class="form-group">
      <label for="edit-photo-image">更換照片（選填，留空則保留原圖）</label>
      <input type="file" id="edit-photo-image" accept="image/*" />
    </div>
    <div class="form-group">
      <label for="edit-photo-title">照片標題</label>
      <input type="text" id="edit-photo-title" placeholder="例如: 登頂紀念、登山口合照" />
    </div>
    <div class="form-group">
      <label for="edit-photo-body">說明文案</label>
      <textarea id="edit-photo-body" placeholder="請輸入對該照片的說明或文字紀錄..."></textarea>
    </div>
    <button id="edit-photo-submit" class="btn-submit">儲存修改</button>
    <div id="edit-photo-status" class="upload-status"></div>
  </div>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<!-- Data (generated by: node build.js) -->
<script src="waypoint-data.js"></script>
<!-- App -->
<script src="jiaminglake.js"></script>
</body>
</html>
